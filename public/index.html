<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TheTotal" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0d0d1a" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #0d0d1a;
        color-scheme: dark;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      input,
      textarea {
        min-width: 0;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        background-color: #0d0d1a;
        color-scheme: dark;
        flex: 1;
      }
    </style>
      <script id="bundle-recover">
      window.addEventListener("error", function (e) {
        var el = e && e.target;
        if (!el || el.tagName !== "SCRIPT") return;
        try {
          if (sessionStorage.getItem("tt-reloaded") === "1") return;
          sessionStorage.setItem("tt-reloaded", "1");
        } catch (err) {}
        location.reload();
      }, true);
      window.addEventListener("load", function () {
        try { sessionStorage.removeItem("tt-reloaded"); } catch (err) {}
      });
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
